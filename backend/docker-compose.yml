version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: testhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testhub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-testhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queues
  redis:
    image: redis:7-alpine
    container_name: testhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: testhub-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Server (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: testhub-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-testhub}:${POSTGRES_PASSWORD:-testhub_secret}@postgres:5432/${POSTGRES_DB:-testhub}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    command: npm run dev:api

  # Worker (Playwright + Scanners)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: testhub-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-testhub}:${POSTGRES_PASSWORD:-testhub_secret}@postgres:5432/${POSTGRES_DB:-testhub}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Phase 2 - Security Tools
      ZAP_API_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-testhub-zap-key}
      NUCLEI_TEMPLATES_PATH: /nuclei-templates
      NUCLEI_SEVERITY: critical,high,medium
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      zap:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages:/app/packages
      - nuclei_templates:/nuclei-templates
    command: npm run dev:worker

  # OWASP ZAP (Phase 2 - Security Scanning)
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: testhub-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:-testhub-zap-key} -config api.disablekey=false
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/JSON/core/view/version/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-testhub-zap-key}

  # Nuclei (Phase 2 - Vulnerability Scanning)
  nuclei:
    build:
      context: .
      dockerfile: docker/nuclei.Dockerfile
    container_name: testhub-nuclei
    volumes:
      - nuclei_templates:/nuclei-templates
    command: nuclei -update-templates
    profiles:
      - tools

  # Frontend (Vite)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: testhub-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
    command: npm run dev:web

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nuclei_templates:

networks:
  default:
    name: testhub-network
